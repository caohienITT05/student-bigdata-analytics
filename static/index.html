<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <title>Hệ Thống Phân Tích & Dự Đoán Học Tập Sinh Viên</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>Babel.registerPreset('multi-react', {presets: [[Babel.availablePresets.react, {runtime: 'classic'}]]});</script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        [hidden] { display: none !important; }
        .dashboard-nav { scrollbar-width: thin; }
        .dashboard-panel { min-width: 0; }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 antialiased">
    <div id="root"></div>

    <script type="text/babel" data-presets="multi-react" src="/static/multisource.jsx"></script>
    <script type="text/babel" data-presets="multi-react">
        const { useState, useEffect, useRef } = React;

        function LegacyPrediction({active}) {
            const [stats, setStats] = useState(null);
            const [students, setStudents] = useState([]);
            const [riskOnly, setRiskOnly] = useState(false);
            const [searchQuery, setSearchQuery] = useState("");
            const [loading, setLoading] = useState(true);
            const [studentPage, setStudentPage] = useState(1);

            // State cho form dự đoán
            const [formData, setFormData] = useState({
                Age_at_enrollment: 20,
                Gender: 1,
                Debtor: 0,
                Tuition_fees_up_to_date: 1,
                Scholarship_holder: 0,
                Curricular_units_1st_sem_grade: 12.0,
                Curricular_units_2nd_sem_grade: 12.5
            });
            const [predictResult, setPredictResult] = useState(null);
            const [predicting, setPredicting] = useState(false);
            const [formErrors, setFormErrors] = useState({});
            const [predictError, setPredictError] = useState('');
            const numericRules = {
                Age_at_enrollment: {label: 'Tuổi nhập học', min: 17, max: 70, integer: true},
                Curricular_units_1st_sem_grade: {label: 'Điểm học kỳ 1', min: 0, max: 20},
                Curricular_units_2nd_sem_grade: {label: 'Điểm học kỳ 2', min: 0, max: 20}
            };
            const validateField = (field, value) => {
                const rule = numericRules[field];
                if (!rule) return '';
                if (String(value).trim() === '') return 'Vui lòng nhập ' + rule.label.toLowerCase() + '.';
                const number = Number(value);
                if (!Number.isFinite(number) || number < rule.min || number > rule.max || (rule.integer && !Number.isInteger(number))) {
                    return rule.label + ' phải là ' + (rule.integer ? 'số nguyên ' : 'số ') + 'từ ' + rule.min + ' đến ' + rule.max + '.';
                }
                return '';
            };
            const updateFormField = (field, value) => {
                setFormData(previous => ({...previous, [field]: value}));
                setPredictResult(null);
                setPredictError('');
                setFormErrors(previous => previous[field] ? {...previous, [field]: validateField(field, value)} : previous);
            };
            const validateOnBlur = field => setFormErrors(previous => ({...previous, [field]: validateField(field, formData[field])}));
            const gradeFields = ['Curricular_units_1st_sem_grade', 'Curricular_units_2nd_sem_grade'];
            const semesterAverage = gradeFields.every(field => !validateField(field, formData[field]))
                ? gradeFields.reduce((sum, field) => sum + Number(formData[field]), 0) / 2
                : null;

            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            // 1. Tải dữ liệu thống kê
            useEffect(() => {
                fetch("/api/stats")
                    .then(res => res.json())
                    .then(data => setStats(data))
                    .catch(err => console.error("Lỗi tải stats:", err));
            }, []);

            // 2. Tải danh sách sinh viên
            useEffect(() => {
                setLoading(true);
                setStudentPage(1);
                const url = `/api/students?risk_only=${riskOnly}&search=${searchQuery}&limit=100`;
                fetch(url)
                    .then(res => res.json())
                    .then(data => {
                        setStudents(data);
                        setLoading(false);
                    })
                    .catch(err => {
                        console.error("Lỗi tải danh sách:", err);
                        setLoading(false);
                    });
            }, [riskOnly, searchQuery]);

            // 3. Vẽ biểu đồ phân bố kết quả dự đoán
            useEffect(() => {
                if (!active || !stats || !chartRef.current) return;

                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }

                const ctx = chartRef.current.getContext("2d");
                chartInstance.current = new Chart(ctx, {
                    type: "doughnut",
                    data: {
                        labels: ["Tốt nghiệp (Graduate)", "Có nguy cơ thôi học (Dropout)", "Đang theo học (Enrolled)"],
                        datasets: [{
                            data: [stats.graduate_predicted, stats.dropout_predicted, stats.enrolled_predicted],
                            backgroundColor: ["#10b981", "#ef4444", "#3b82f6"]
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: "bottom" }
                        }
                    }
                });
                return () => {
                    chartInstance.current.destroy();
                    chartInstance.current = null;
                };
            }, [stats, active]);

            // 4. Xử lý dự đoán cá nhân
            const handlePredict = async (e) => {
                e.preventDefault();
                setPredictResult(null);
                setPredictError('');
                const errors = Object.fromEntries(Object.keys(numericRules).map(field => [field, validateField(field, formData[field])]));
                setFormErrors(errors);
                if (Object.values(errors).some(Boolean)) return;
                setPredicting(true);
                try {
                    const res = await fetch("/api/predict", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            ...formData,
                            ...Object.fromEntries(Object.keys(numericRules).map(field => [field, Number(formData[field])])),
                            Marital_status: 1,
                            Nationality: 1
                        })
                    });
                    const result = await res.json();
                    if (!res.ok || result.error) {
                        const message = result.error || (Array.isArray(result.detail)
                            ? 'Dữ liệu không hợp lệ. Kiểm tra tuổi (17–70), điểm (0–20) và các lựa chọn trong form.'
                            : result.detail) || 'Không thực hiện được dự đoán. Vui lòng thử lại.';
                        throw new Error(message);
                    }
                    setPredictResult(result);
                } catch (err) {
                    setPredictError(err instanceof TypeError ? 'Không kết nối được API dự đoán. Vui lòng thử lại.' : err.message);
                } finally {
                    setPredicting(false);
                }
            };

            return (
                <div className="space-y-6">
                    <p className="text-sm text-slate-600">Tra cứu dataset gốc và chạy mô hình Random Forest đã có. Cột “Kết quả trong dữ liệu” là Target gốc; “Dự đoán của mô hình” là nhãn do model sinh ra.</p>
                        {/* KPI Cards */}
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                                <p className="text-sm font-medium text-slate-500">Tổng sinh viên theo dõi</p>
                                <h3 className="text-3xl font-extrabold text-slate-900 mt-2">{stats ? stats.total_students.toLocaleString() : "..."}</h3>
                                <p className="text-xs text-slate-400 mt-1">Dataset gốc · CSV dự đoán đã xuất</p>
                            </div>
                            <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                                <p className="text-sm font-medium text-rose-600">Dự đoán nguy cơ thôi học (Dropout)</p>
                                <h3 className="text-3xl font-extrabold text-rose-600 mt-2">{stats ? stats.dropout_predicted.toLocaleString() : "..."}</h3>
                                <p className="text-xs text-rose-400 mt-1">Tỷ lệ: {stats ? `${stats.risk_rate_percent}%` : "..."}</p>
                            </div>
                            <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                                <p className="text-sm font-medium text-emerald-600">Dự đoán tốt nghiệp (Graduate)</p>
                                <h3 className="text-3xl font-extrabold text-emerald-600 mt-2">{stats ? stats.graduate_predicted.toLocaleString() : "..."}</h3>
                                <p className="text-xs text-emerald-500 mt-1">Nhãn dự đoán của mô hình</p>
                            </div>
                            <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                                <p className="text-sm font-medium text-slate-500">Điểm trung bình Kỳ 1 / Kỳ 2</p>
                                <h3 className="text-3xl font-extrabold text-indigo-600 mt-2">{stats ? `${stats.avg_grade_sem1} / ${stats.avg_grade_sem2}` : "..."}</h3>
                                <p className="text-xs text-slate-400 mt-1">Thang điểm chuẩn hóa 20</p>
                            </div>
                        </div>

                        {/* Layout 2 Cột: Biểu đồ & Form Dự đoán */}
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            {/* Cột 1: Biểu đồ Donut */}
                            <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center">
                                <h3 className="font-semibold text-slate-800 text-sm w-full mb-3">Phân bố dự đoán của mô hình</h3>
                                <div className="w-full h-64 relative">
                                    <canvas ref={chartRef} role="img" aria-label="Phân bố dự đoán của mô hình"></canvas>
                                </div>
                            </div>

                            {/* Cột 2: Form thử nghiệm dự đoán nhanh */}
                            <div className="lg:col-span-2 bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                                <h4 className="font-semibold text-slate-800 text-sm mb-4">Công cụ dự đoán trạng thái sinh viên (AI)</h4>
                                <p className="text-xs text-slate-500 mb-4">Dùng điểm hai học kỳ để dự đoán. Tuổi 17–70 theo dữ liệu của model; điểm từ 0 đến 20.</p>
                                <form onSubmit={handlePredict} noValidate className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                    <div>
                                        <label htmlFor="predict-Age_at_enrollment" className="text-xs font-medium text-slate-600">Độ tuổi nhập học</label>
                                        <input
                                            type="number" min="17" max="70" step="1" required
                                            className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                            id="predict-Age_at_enrollment"
                                            value={formData.Age_at_enrollment}
                                            onChange={e => updateFormField('Age_at_enrollment', e.target.value)}
                                            onBlur={() => validateOnBlur('Age_at_enrollment')}
                                            aria-invalid={Boolean(formErrors.Age_at_enrollment)}
                                            aria-describedby="predict-Age_at_enrollment-error"
                                        />
                                        {formErrors.Age_at_enrollment && <p id="predict-Age_at_enrollment-error" role="alert" className="text-xs text-rose-600 mt-1">{formErrors.Age_at_enrollment}</p>}
                                    </div>
                                    <div>
                                        <label htmlFor="predict-Tuition_fees_up_to_date" className="text-xs font-medium text-slate-600">Thanh toán học phí</label>
                                        <select
                                            className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                            id="predict-Tuition_fees_up_to_date"
                                            value={formData.Tuition_fees_up_to_date}
                                            onChange={e => updateFormField('Tuition_fees_up_to_date', Number(e.target.value))}
                                        >
                                            <option value={1}>Đã cập nhật đầy đủ</option>
                                            <option value={0}>Chưa cập nhật đầy đủ</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label htmlFor="predict-average" className="text-xs font-medium text-slate-600">Điểm trung bình hai học kỳ</label>
                                        <output id="predict-average" htmlFor="predict-Curricular_units_1st_sem_grade predict-Curricular_units_2nd_sem_grade"
                                            aria-live="polite" className="block mt-1 w-full border border-indigo-100 bg-indigo-50 text-indigo-700 rounded-lg px-3 py-2 text-sm font-semibold">
                                            {semesterAverage === null ? '—' : semesterAverage.toLocaleString('vi-VN', {maximumFractionDigits: 2}) + ' / 20'}
                                        </output>
                                    </div>
                                    <div>
                                        <label htmlFor="predict-Scholarship_holder" className="text-xs font-medium text-slate-600">Học bổng</label>
                                        <select
                                            className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                            id="predict-Scholarship_holder"
                                            value={formData.Scholarship_holder}
                                            onChange={e => updateFormField('Scholarship_holder', Number(e.target.value))}
                                        >
                                            <option value={0}>Không có học bổng</option>
                                            <option value={1}>Được nhận học bổng</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label htmlFor="predict-Curricular_units_1st_sem_grade" className="text-xs font-medium text-slate-600">Điểm Học kỳ 1 (thang 20)</label>
                                        <input
                                            type="number" min="0" max="20" step="any" required
                                            className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                            id="predict-Curricular_units_1st_sem_grade"
                                            value={formData.Curricular_units_1st_sem_grade}
                                            onChange={e => updateFormField('Curricular_units_1st_sem_grade', e.target.value)}
                                            onBlur={() => validateOnBlur('Curricular_units_1st_sem_grade')}
                                            aria-invalid={Boolean(formErrors.Curricular_units_1st_sem_grade)}
                                            aria-describedby="predict-Curricular_units_1st_sem_grade-error"
                                        />
                                        {formErrors.Curricular_units_1st_sem_grade && <p id="predict-Curricular_units_1st_sem_grade-error" role="alert" className="text-xs text-rose-600 mt-1">{formErrors.Curricular_units_1st_sem_grade}</p>}
                                    </div>
                                    <div>
                                        <label htmlFor="predict-Curricular_units_2nd_sem_grade" className="text-xs font-medium text-slate-600">Điểm Học kỳ 2 (thang 20)</label>
                                        <input
                                            type="number" min="0" max="20" step="any" required
                                            className="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                            id="predict-Curricular_units_2nd_sem_grade"
                                            value={formData.Curricular_units_2nd_sem_grade}
                                            onChange={e => updateFormField('Curricular_units_2nd_sem_grade', e.target.value)}
                                            onBlur={() => validateOnBlur('Curricular_units_2nd_sem_grade')}
                                            aria-invalid={Boolean(formErrors.Curricular_units_2nd_sem_grade)}
                                            aria-describedby="predict-Curricular_units_2nd_sem_grade-error"
                                        />
                                        {formErrors.Curricular_units_2nd_sem_grade && <p id="predict-Curricular_units_2nd_sem_grade-error" role="alert" className="text-xs text-rose-600 mt-1">{formErrors.Curricular_units_2nd_sem_grade}</p>}
                                    </div>

                                    {predictError && <p role="alert" className="sm:col-span-3 text-sm text-rose-700 bg-rose-50 rounded-lg p-3">{predictError}</p>}
                                    <div className="sm:col-span-3 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 pt-2">
                                        <button
                                            type="submit"
                                            disabled={predicting}
                                            className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg text-sm transition-colors shadow-sm disabled:opacity-50"
                                        >
                                            {predicting ? "Đang xử lý..." : "Chạy Dự Đoán"}
                                        </button>

                                        {predictResult && (
                                            <div className={`px-4 py-2 rounded-lg text-sm font-semibold flex flex-wrap items-center gap-2 ${predictResult.is_at_risk ? 'bg-red-100 text-red-700 border border-red-200' : 'bg-green-100 text-green-700 border border-green-200'}`}>
                                                <span>Dự đoán: {predictResult.prediction}</span>
                                                <span>— {predictResult.risk_warning}</span>
                                            </div>
                                        )}
                                    </div>
                                </form>
                            </div>
                        </div>

                        {/* Bảng Danh sách Sinh viên & Cảnh báo Sớm */}
                        <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                            <div className="p-4 border-b border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                                <div>
                                    <h4 className="font-semibold text-slate-800 text-base">Danh Sách Theo Dõi & Cảnh Báo Nguy Cơ</h4>
                                    <p className="text-xs text-slate-500">Tối đa 100 kết quả tìm kiếm, 20 dòng mỗi trang. Dùng mã sinh viên để thu hẹp kết quả.</p>
                                </div>
                                <div className="flex items-center gap-3 w-full sm:w-auto">
                                    <input
                                        type="text"
                                        placeholder="Tìm mã SV..."
                                        aria-label="Tìm mã sinh viên"
                                        className="border border-slate-300 rounded-lg px-3 py-1.5 text-sm min-w-0 w-full sm:w-44 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                        value={searchQuery}
                                        onChange={e => setSearchQuery(e.target.value)}
                                    />
                                    <button
                                        onClick={() => setRiskOnly(!riskOnly)}
                                        className={`px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition-colors border ${riskOnly ? 'bg-rose-600 text-white border-rose-600' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50'}`}
                                    >
                                        {riskOnly ? "✓ Đang lọc nguy cơ" : "Lọc SV nguy cơ thôi học"}
                                    </button>
                                </div>
                            </div>

                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse text-sm">
                                    <thead>
                                        <tr className="bg-slate-50 border-b border-slate-200 text-slate-600 text-xs font-semibold uppercase">
                                            <th className="py-3 px-4">Mã Sinh Viên</th>
                                            <th className="py-3 px-4">Tuổi</th>
                                            <th className="py-3 px-4">Học Phí</th>
                                            <th className="py-3 px-4">Điểm Kỳ 1</th>
                                            <th className="py-3 px-4">Điểm Kỳ 2</th>
                                            <th className="py-3 px-4">Kết quả trong dữ liệu</th>
                                            <th className="py-3 px-4">Dự đoán của mô hình</th>
                                            <th className="py-3 px-4">Trạng Thái Cảnh Báo</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {loading ? (
                                            <tr><td colSpan="8" className="py-6 text-center text-slate-500">Đang tải dữ liệu...</td></tr>
                                        ) : students.length === 0 ? (
                                            <tr><td colSpan="8" className="py-6 text-center text-slate-500">Không tìm thấy sinh viên phù hợp</td></tr>
                                        ) : (
                                            students.slice((studentPage - 1) * 20, studentPage * 20).map(s => {
                                                const isRisk = s.Predicted_Target === 'Dropout';
                                                return (
                                                    <tr key={s.StudentID} className="hover:bg-slate-50 transition-colors">
                                                        <td className="py-3 px-4 font-mono font-medium text-slate-900">{s.StudentID}</td>
                                                        <td className="py-3 px-4 text-slate-600">{s.Age_at_enrollment}</td>
                                                        <td className="py-3 px-4">
                                                            {s['Tuition fees up to date'] === 1 ? (
                                                                <span className="text-xs text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded">Đã cập nhật</span>
                                                            ) : (
                                                                <span className="text-xs text-rose-600 bg-rose-50 px-2 py-0.5 rounded">Chưa cập nhật</span>
                                                            )}
                                                        </td>
                                                        <td className="py-3 px-4 text-slate-700 font-medium">{s['Curricular units 1st sem (grade)']}</td>
                                                        <td className="py-3 px-4 text-slate-700 font-medium">{s['Curricular units 2nd sem (grade)']}</td>
                                                        <td className="py-3 px-4 text-slate-700">{s.Target == null ? '—' : s.Target}</td>
                                                        <td className="py-3 px-4">
                                                            <span className={`inline-flex px-2 py-0.5 rounded-full text-xs font-semibold ${isRisk ? 'bg-red-100 text-red-800' : 'bg-emerald-100 text-emerald-800'}`}>
                                                                {s.Predicted_Target}
                                                            </span>
                                                        </td>
                                                        <td className="py-3 px-4">
                                                            {isRisk ? (
                                                                <span className="inline-flex items-center text-xs font-medium text-rose-700 bg-rose-50 border border-rose-200 px-2.5 py-1 rounded-md">
                                                                    ⚠️ Cần can thiệp học tập
                                                                </span>
                                                            ) : (
                                                                <span className="text-xs text-slate-400">Tiến độ tốt</span>
                                                            )}
                                                        </td>
                                                    </tr>
                                                );
                                            })
                                        )}
                                    </tbody>
                                </table>
                            </div>
                            {!loading && <div className="px-4 pb-4"><window.DashboardPager result={{total: students.length, pages: Math.ceil(students.length / 20)}} number={studentPage} onChange={setStudentPage}/></div>}
                        </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<window.MultiSourceDashboard PredictionPanel={LegacyPrediction} />);
    </script>
</body>

</html>
